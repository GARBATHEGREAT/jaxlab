[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxlab"
version = "0.1.0"
description = "Small JAX/XLA/Pallas experiments with honest benchmarks"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["jaxlab*"]
